name: setup-l9
description: >
  Recreate the box layout and environment: the repo checkout is mounted at the same absolute path the
  configs use (/workspace/qg-unification/l9-run), and .venv is built from requirements.lock.txt
  (Python 3.11, pyRingGW 2.11.2, cpnest 0.12.0, frozen from the box's l9-run/.venv).
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: requirements.lock.txt
    - shell: bash
      run: |
        set -euo pipefail
        sudo mkdir -p /workspace/qg-unification
        sudo ln -sfn "$GITHUB_WORKSPACE" /workspace/qg-unification/l9-run
        uv venv --python 3.11 .venv
        uv pip install --python .venv/bin/python -r requirements.lock.txt
        .venv/bin/python -c "import pyRing, cpnest; print('pyRing', pyRing.__file__, 'cpnest', cpnest.__version__)"
        nproc; free -g
